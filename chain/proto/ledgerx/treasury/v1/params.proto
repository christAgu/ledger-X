syntax = "proto3";
package ledgerx.treasury.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "ledgerx/x/treasury/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "ledgerx/x/treasury/Params";
  option (gogoproto.equal) = true;
  
  string treasury_address = 1;
  repeated string allowed_denoms = 2;
}